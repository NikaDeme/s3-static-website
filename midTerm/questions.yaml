1. რა კავშირია UserData-სა და AWS::CloudFormation::Init-ს შორის? (3 ქულა)

UserData არის სკრიპტი, რომელიც EC2 ინსტანსის პირველი ჩართვისას ავტომატურად სრულდება.

AWS::CloudFormation::Init რესურსის Metadata სექციაში იწერება და დეკლარაციულად აღწერს ინსტანსის კონფიგურაციას: 
რა პაკეტები დაყენდეს, რა ფაილები შეიქმნას, რა ბრძანებები შესრულდეს და რა სერვისები გაეშვას. თავისით ის არ სრულდება.

მათ შორის კავშირი ასეთია: UserData-ში იძახებენ cfn-init სკრიპტს, რომელიც Metadata-დან Init-ის კონფიგურაციას 
კითხულობს და ინსტანსზე იყენებს. ანუ UserData კონფიგურაციას ამუშავებს, Init კი თავად ამ კონფიგურაციას შეიცავს. 
ამის შემდეგ cfn-signal CloudFormation-ს ატყობინებს, რომ კონფიგურაცია წარმატებით დასრულდა.

2. რომელი ფუნქციონალით შეიძლება Template-ში ისეთი ცვლადების განსაზღვრა, რომელთა მნიშვნელობაც stack-ის შექმნისას შეიცვლება? (1 ქულა)

Parameters.

1) ჩამოთვალეთ CloudFormation-ის Helper Script-ები და აღწერეთ მათი ფუნქციონალი (3 ქულა)

Helper Script-ები Python-ის სკრიპტებია, რომლებიც EC2 ინსტანსზე სრულდება (პაკეტი aws-cfn-bootstrap):

cfn-init კითხულობს AWS::CloudFormation::Init-ის მეტამონაცემებს და ინსტანსზე პაკეტებს აყენებს, ფაილებს ქმნის, ბრძანებებს ასრულებს და სერვისებს უშვებს.
cfn-signal CloudFormation-ს სიგნალს უგზავნის, რომ ინსტანსის კონფიგურაცია წარმატებით დასრულდა ან ჩავარდა. გამოიყენება CreationPolicy-სთან ან WaitCondition-თან ერთად.
cfn-get-metadata რესურსის მეტამონაცემებს კითხულობს და ეკრანზე გამოაქვს.
cfn-hup დემონია, რომელიც მეტამონაცემების ცვლილებებს ადევნებს თვალს. stack-ის განახლებისას ის ინსტანსზე ბრძანებებს ავტომატურად უშვებს.

2) რა განსხვავებაა cfn-lint-სა და aws cloudformation validate-template-ს შორის? (2 ქულა)

validate-template არის AWS CLI-ის ბრძანება, რომელიც template-ს AWS-ში აგზავნის და მხოლოდ სინტაქსს ამოწმებს: სწორი JSON/YAML-ია თუ არა და სწორია თუ არა ზოგადი სტრუქტურა. ის ვერ ამჩნევს რესურსების არასწორ თვისებებს და არასწორ მნიშვნელობებს.
cfn-lint არის ღია კოდის ინსტრუმენტი, რომელიც ლოკალურად მუშაობს და გაცილებით ღრმად ამოწმებს. ის CloudFormation-ის სპეციფიკაციას ეყრდნობა და ამჩნევს არასწორ ან არარსებულ თვისებებს, არასწორ ტიპებს, დაშვებულ მნიშვნელობებს, !Ref და !GetAtt შეცდომებს და best practice-ის დარღვევებს.

3) რა IAM როლი აქვს CloudFormation-ს, როგორც სერვისს? (1 ქულა)

Service Role. ეს არის IAM როლი, რომელსაც CloudFormation იღებს (assume) და მისი უფლებებით ქმნის, ცვლის და შლის რესურსებს stack-ში. თუ Service Role მითითებული არ არის, CloudFormation იმ მომხმარებლის უფლებებს იყენებს, რომელიც stack-ს უშვებს.

4) რომელი AWS სერვისი იწერს ანგარიშის აქტივობას, API გამოძახებებს და მომხმარებლების ქმედებებს? (1 ქულა)

AWS CloudTrail.

5) რა ფუნქციონალი აქვს UserData-ს AWS CloudFormation-ში? (2 ქულა)

UserData არის AWS::EC2::Instance-ის თვისება, რომლითაც ინსტანსს სკრიპტს (მაგ. bash) ან cloud-init-ის კონფიგურაციას გადასცემთ. ინსტანსი მას პირველი ჩართვისას ავტომატურად ასრულებს. ასე შეიძლება პაკეტების დაყენება, აპლიკაციის კონფიგურაცია და Helper Script-ების (cfn-init, cfn-signal) გამოძახება. Template-ში UserData Base64-ით უნდა იყოს კოდირებული: Fn::Base64, ხშირად Fn::Sub-თან ერთად.

6) რა კავშირია UserData-სა და AWS::CloudFormation::Init-ს შორის? (3 ქულა)

UserData არის სკრიპტი, რომელიც ინსტანსის პირველი ჩართვისას სრულდება. AWS::CloudFormation::Init რესურსის Metadata-ში იწერება და დეკლარაციულად აღწერს კონფიგურაციას (packages, files, commands, services). თავისით ის არ სრულდება. მათ აკავშირებს ის, რომ UserData-ში იძახებენ cfn-init-ს, რომელიც Init-ის კონფიგურაციას კითხულობს და ინსტანსზე იყენებს. ამის შემდეგ cfn-signal CloudFormation-ს წარმატების შეტყობინებას უგზავნის.

7) რა განსხვავებაა CloudFormation Guard-სა და cfn-lint-ს შორის?

cfn-lint ამოწმებს, არის თუ არა template ტექნიკურად სწორი: სინტაქსი, რესურსების თვისებები, ტიპები და მნიშვნელობები CloudFormation-ის სპეციფიკაციის მიხედვით.
CloudFormation Guard (cfn-guard) policy-as-code ინსტრუმენტია, რომელიც ამოწმებს, აკმაყოფილებს თუ არა template ორგანიზაციის წესებს. ამ წესებს თქვენ თავად წერთ, მაგალითად: „ყველა S3 ბაკეტი დაშიფრული უნდა იყოს“ ან „RDS არ უნდა იყოს PubliclyAccessible“.
მოკლედ: cfn-lint ამოწმებს, სწორად არის თუ არა დაწერილი template, Guard კი ამოწმებს, შეესაბამება თუ არა ის უსაფრთხოებისა და კომპანიის წესებს.