AWSTemplateFormatVersion: "2010-09-09"
Description: Deliberately broken template - every custom rule must report an error

Parameters:
  AmiID:
    Type: AWS::SSM::Parameter::Value<AWS::EC2::Image::Id>
    Default: /aws/service/ami-amazon-linux-latest/al2023-ami-kernel-default-x86_64

Resources:
  # E9001: tag missing
  FreeTierInstance:
    Type: AWS::EC2::Instance
    Properties:
      ImageId: !Ref AmiID
      InstanceType: t2.micro

  # E9001: wrong value
  PerformanceInstance:
    Type: AWS::EC2::Instance
    Properties:
      ImageId: !Ref AmiID
      InstanceType: m5.large
      Tags:
        - Key: PerformanceCritical
          Value: "maybe"

  # E9002: out of range
  DataVolume:
    Type: AWS::EC2::Volume
    Properties:
      AvailabilityZone: !GetAtt FreeTierInstance.AvailabilityZone
      Size: 10
      VolumeType: gp3
      Tags:
        - Key: Priority
          Value: "20000"

  # E9002: tag missing
  SecondVolume:
    Type: AWS::EC2::Volume
    Properties:
      AvailabilityZone: !GetAtt FreeTierInstance.AvailabilityZone
      Size: 10
      VolumeType: gp3

  # E9003: BlockPublicAcls false, no tag
  PublicBucket:
    Type: AWS::S3::Bucket
    Properties:
      PublicAccessBlockConfiguration:
        BlockPublicAcls: false
        IgnorePublicAcls: true
        BlockPublicPolicy: true
        RestrictPublicBuckets: true
